name: Validate Template
on: push

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Sanity Template
        uses: sanity-io/template-validator@v3
        with:
          # Private repos need auth — the action reads via raw.githubusercontent.com.
          token: ${{ secrets.GITHUB_TOKEN }}
